  locked mobile max-width, fluid breakpoints) implementing ticket
  RCGLA-034-A02 "Define Global Grid Alignment Rules".
version: 1.0.0
homepage: https://github.com/your-org/global-grid-alignment
repository: https://github.com/your-org/global-grid-alignment

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # This is a pure Dart/Flutter package (no platform channels, no assets).
